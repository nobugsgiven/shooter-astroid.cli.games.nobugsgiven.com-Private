name: Publish Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should-release: ${{ steps.check-release.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get version from .csproj
        id: get-version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' *.csproj || echo "")
          if [ -z "$VERSION" ]; then
            echo "No <Version> found in .csproj"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if version changed
        id: check-version-change
        run: |
          git show HEAD^:*.csproj > /tmp/old.csproj 2>/dev/null || true
          OLD_VERSION=$(grep -oP '<Version>\K[^<]+' /tmp/old.csproj 2>/dev/null || echo "")
          NEW_VERSION="${{ steps.get-version.outputs.version }}"
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Version changed: '$OLD_VERSION' -> '$NEW_VERSION'"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged: $NEW_VERSION"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.check-version-change.outputs.changed }}" != "true" ]; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION="${{ steps.get-version.outputs.version }}"
          if gh api repos/${{ github.repository }}/releases/tags/v$VERSION --silent 2>/dev/null; then
            echo "Release v$VERSION already exists. Skipping."
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist. Will create."
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ""
          - rid: osx-x64
            os: macos-latest
            ext: ""
          - rid: osx-arm64
            os: macos-latest
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file
        run: |
          dotnet publish \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -o ./publish

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifacts
          if [[ "${{ matrix.rid }}" == win* ]]; then
            zip -j ./artifacts/ShooterAstroidConsole-${{ matrix.rid }}.zip ./publish/ShooterAstroidConsole${{ matrix.ext }}
          else
            chmod +x ./publish/ShooterAstroidConsole
            tar -czf ./artifacts/ShooterAstroidConsole-${{ matrix.rid }}.tar.gz -C ./publish ShooterAstroidConsole
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShooterAstroidConsole-${{ matrix.rid }}
          path: ./artifacts/*

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          files: ./artifacts/*
          generate_release_notes: true
